name: Build DualTrack APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

permissions:
  contents: write # required to upload release assets on tagged builds

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with the Android SDK preinstalled at $ANDROID_HOME.
      - name: Install exact SDK platform and build tools
        shell: bash
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/dualtrack-${GITHUB_REF_NAME}.apk

      - name: Upload APK artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: dualtrack-debug-apk
          path: app/build/outputs/apk/debug/dualtrack-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/dualtrack-*.apk
          generate_release_notes: true
